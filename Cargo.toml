[workspace]
members = [
    "src-tauri",
    "engine",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
# Using native-tls instead of rustls for better SOCKS5 proxy support
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "socks", "native-tls"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTML parsing
scraper = "0.24"

# URL encoding
urlencoding = "2.1"

# Regular expressions
regex = "1.10"

# Tauri
tauri = { version = "2.0", features = [] }

# Concurrency
futures = "0.3"
async-trait = "0.1"

# TMDB API client - removed, using direct reqwest calls instead

# Environment variable loading
dotenvy = "0.15"

# URL parsing
url = "2.5"

# Directory utilities
dirs = "5.0"
